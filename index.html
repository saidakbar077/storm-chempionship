<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1vs1 Chempionat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 40px;
        }

        header {
            background-color: #1e293b;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://via.placeholder.com/1200x400') center/cover;
            color: white;
            text-align: center;
            padding: 3rem 1rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .container {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        h2 {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f8fafc;
        }

        .tg-link {
            color: #0088cc;
            text-decoration: none;
            font-weight: bold;
        }

        .tg-link:hover {
            text-decoration: underline;
        }

        .match-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .match-card input {
            width: 50px;
            text-align: center;
            margin: 0 5px;
        }

        .admin-panel {
            background-color: #fff7ed;
            border: 1px solid #ffedd5;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>

    <header>
        <h2>1vs1 Tournament</h2>
        <button onclick="toggleAdmin()">Admin Kirish</button>
    </header>

    <div class="hero">
        <h1>Milliy Chempionat 2026</h1>
        <p>G'olib bo'lish uchun ro'yxatdan o'ting va kuchingizni ko'rsating!</p>
    </div>

    <div class="container">
        <!-- Ro'yxatdan o'tish formasi -->
        <div class="card">
            <h2>Ishtirok etish</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="playerName">Ismingiz yoki Taxallusingiz:</label>
                    <input type="text" id="playerName" required placeholder="Masalan: Bekzod">
                </div>
                <div class="form-group">
                    <label for="telegramHandle">Telegram Username:</label>
                    <input type="text" id="telegramHandle" required placeholder="username (masalan: storm_user)">
                </div>
                <button type="submit">Ro'yxatdan o'tish</button>
            </form>
        </div>

        <!-- Ishtirokchilar ro'yxati -->
        <div class="card">
            <h2>Ishtirokchilar</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Ism</th>
                        <th>Telegram</th>
                    </tr>
                </thead>
                <tbody id="playersList">
                    <tr>
                        <td colspan="3">Yuklanmoqda...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Admin Paneli -->
        <div class="card admin-panel" id="adminPanel" style="display: none;">
            <h2>Admin Boshqaruvi</h2>
            <button onclick="drawMatches()">Qur'a Tashlash (Matchlarni yaratish)</button>
            <div id="adminMatches" style="margin-top: 15px;"></div>
        </div>

        <!-- O'yinlar jadvali -->
        <div class="card">
            <h2>O'yinlar Jadvallari</h2>
            <div id="matchesList">Hozircha o'yinlar belgilanmagan.</div>
        </div>
    </div>

    <script>
        // Firebase sozlamalari
        const firebaseConfig = {
            databaseURL: "https://storm-chempionship-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Ro'yxatdan o'tish
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('playerName').value.trim();
            let tg = document.getElementById('telegramHandle').value.trim();

            if (!tg.startsWith('@')) tg = '@' + tg;

            const newPlayerRef = db.ref('players').push();
            newPlayerRef.set({
                name: name,
                telegram: tg
            }, (error) => {
                if (!error) {
                    alert("Muvaffaqiyatli ro'yxatdan o'tdingiz!");
                    document.getElementById('registerForm').reset();
                } else {
                    alert("Xatolik yuz berdi: " + error.message);
                }
            });
        });

        // Ishtirokchilarni yuklash
        db.ref('players').on('value', (snapshot) => {
            const playersList = document.getElementById('playersList');
            playersList.innerHTML = '';
            let count = 1;

            if (snapshot.exists()) {
                snapshot.forEach((child) => {
                    const player = child.val();
                    const cleanTg = player.telegram.replace('@', '');
                    playersList.innerHTML += `
                        <tr>
                            <td>${count++}</td>
                            <td>${player.name}</td>
                            <td><a class="tg-link" href="https://t.me/${cleanTg}" target="_blank">${player.telegram}</a></td>
                        </tr>
                    `;
                });
            } else {
                playersList.innerHTML = '<tr><td colspan="3">Hozircha ishtirokchilar mavjud emas</td></tr>';
            }
        });

        // Admin panelini ko'rsatish
        function toggleAdmin() {
            const pass = prompt("Admin parolini kiriting:");
            if (pass === "1234") {
                document.getElementById('adminPanel').style.display = 'block';
                alert("Admin rejimi yoqildi!");
            } else {
                alert("Parol noto'g'ri!");
            }
        }

        // Qur'a tashlash
        function drawMatches() {
            db.ref('players').once('value', (snapshot) => {
                const players = [];
                snapshot.forEach((child) => {
                    players.push({ id: child.key, ...child.val() });
                });

                if (players.length < 2) {
                    alert("Qur'a uchun kamida 2 ta ishtirokchi kerak!");
                    return;
                }

                players.sort(() => Math.random() - 0.5);
                const matches = [];

                for (let i = 0; i < players.length; i += 2) {
                    if (players[i + 1]) {
                        matches.push({
                            p1: players[i].name,
                            p2: players[i + 1].name,
                            score1: 0,
                            score2: 0,
                            status: 'pending'
                        });
                    }
                }

                db.ref('matches').set(matches);
                alert("Qur'a muvaffaqiyatli o'tkazildi!");
            });
        }

        // O'yinlarni yuklash va ko'rsatish
        db.ref('matches').on('value', (snapshot) => {
            const matchesList = document.getElementById('matchesList');
            const adminMatches = document.getElementById('adminMatches');
            matchesList.innerHTML = '';
            adminMatches.innerHTML = '';

            if (snapshot.exists()) {
                const matches = snapshot.val();
                matches.forEach((match, index) => {
                    matchesList.innerHTML += `
                        <div class="match-card">
                            <span><b>${match.p1}</b> vs <b>${match.p2}</b></span>
                            <span>Hisob: <b>${match.score1} : ${match.score2}</b></span>
                        </div>
                    `;

                    adminMatches.innerHTML += `
                        <div class="match-card">
                            <span>${match.p1} vs ${match.p2}</span>
                            <div>
                                <input type="number" id="s1_${index}" value="${match.score1}">
                                :
                                <input type="number" id="s2_${index}" value="${match.score2}">
                                <button onclick="saveScore(${index})">Saqlash</button>
                            </div>
                        </div>
                    `;
                });
            } else {
                matchesList.innerHTML = 'Hozircha o' + "'" + 'yinlar belgilanmagan.';
            }
        });

        // Hisobni saqlash
        function saveScore(index) {
            const s1 = document.getElementById(`s1_${index}`).value;
            const s2 = document.getElementById(`s2_${index}`).value;

            db.ref(`matches/${index}`).update({
                score1: parseInt(s1),
                score2: parseInt(s2),
                status: 'completed'
            });
        }
    </script>
</body>

</html>
